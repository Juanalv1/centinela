services:
  - type: web
    name: centinela-victim
    runtime: docker
    rootDir: victim
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: EXECUTOR_TOKEN
        sync: false
      # Case 2: SME API data. The victim creates the schema and the
      # least-privilege `centinela_executor` role (needs CREATEROLE).
      - key: DATABASE_URL
        fromDatabase:
          name: centinela-db
          property: connectionString
      - key: EXECUTOR_DB_PASSWORD
        sync: false
      - key: DEMO_LEAKED_KEY
        sync: false
      - key: OFFICE_CIDR
        value: 203.0.113.0/24
      # Two proxies sit in front of the service (Cloudflare, then Render's
      # load balancer); each appends one X-Forwarded-For entry. Verified in the
      # cloud: with 2, the victim sees the real client ip and ignores spoofs.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Where the harmless `sync` job keeps its outbound connection (a host we control).
      - key: SYNC_ENDPOINT
        value: https://centinela-lyiy.onrender.com/health
      # Stolen-credential lab (A): luis's reports key, the ips its seeded history
      # comes from, and the token for POST /lab/reset between trials.
      - key: DEMO_LUIS_KEY
        sync: false
      - key: LAB_KNOWN_IPS
        sync: false
      - key: LAB_TOKEN
        sync: false

  - type: web
    name: centinela
    runtime: docker
    rootDir: centinela_svc
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: VICTIM_URL
        sync: false
      - key: EXECUTOR_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL
        value: claude-sonnet-5-5
      - key: POLL_SECONDS
        value: "2"
      # Warm-up window: workloads seen here form the baseline; later ones are "new".
      - key: BASELINE_SECONDS
        value: "60"
      # Per-key window compared against each API key's history (lab: 120 s).
      - key: KEY_WINDOW_SECONDS
        value: "120"
      # Hash-chained audit log survives restarts. Its own database: the victim
      # (the machine under attack) must never hold credentials that reach it,
      # and Centinela must never hold the victim's owner credential.
      - key: AUDIT_DATABASE_URL
        fromDatabase:
          name: centinela-audit-db
          property: connectionString
      # postgresql://centinela_executor:<EXECUTOR_DB_PASSWORD>@<internal host>/<db>; never the owner URL.
      - key: EXECUTOR_DATABASE_URL
        sync: false
      - key: APPROVER_TOKEN
        sync: false
      # Push ingestion (POST /api/ingest/access, forward_nginx.py). Unset: disabled.
      - key: INGEST_TOKEN
        sync: false
      - key: OFFICE_CIDR
        value: 203.0.113.0/24

databases:
  - name: centinela-db         # victim data (owner: victim; executor gets its own role)
    plan: basic-256mb
    region: oregon
  - name: centinela-audit-db   # Centinela's audit log only
    plan: basic-256mb
    region: oregon
